[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "color-semantic-model"
version = "0.1.0"
description = "English text to color recommendation via sentence-transformer retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "numpy>=1.24",
  "pydantic>=2",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "torch",
  "sentence-transformers>=3.0",
  "transformers",
  "datasets",
  "accelerate",
  "scikit-learn",
]
color_pedia = [
  "datasets>=2.14",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colorrec"]

[tool.hatch.build.targets.sdist]
include = [
  "src/colorrec",
  "configs",
  "tests",
  "README.md",
  "manual_download.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
