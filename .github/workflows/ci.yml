name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync and test
        run: |
          uv sync --extra dev
          uv run python -m pytest tests/ -q --tb=short
