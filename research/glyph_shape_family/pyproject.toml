[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glyph-shape-family"
version = "0.1.0"
description = "Explainable skeleton shape features + UMAP for lowercase glyph family analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
umap = ["umap-learn>=0.5"]
cluster = ["hdbscan>=0.8"]
all = ["umap-learn>=0.5", "hdbscan>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["glyph_shape_family"]

[tool.hatch.build.targets.sdist]
include = ["glyph_shape_family", "README.md", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
