[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synglyph-letter-sequence"
version = "0.1.0"
description = "Letter-level sequence model (BiLSTM) for Lab, prominence, spread, boundary"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Pin below 2.3: PyPI torch 2.3+ dropped macOS x86_64 wheels; Apple Silicon unaffected.
  "torch>=2.0,<2.3",
  # PyTorch ONNX exporter (torch.onnx.export) requires the onnx package.
  "onnx>=1.15",
  # PyTorch 2.2.x wheels are built against NumPy 1.x ABI; use 1.x until torch matches NumPy 2.
  "numpy>=1.24,<2",
  "pyyaml>=6.0",
  "pronouncing>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["letter_sequence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
